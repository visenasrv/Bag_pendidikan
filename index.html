<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laporan &amp; Evaluasi PPG Desa Sangatta Selatan</title>
  <meta name="description" content="Pelaporan bulanan, notulen, dan daftar hadir musyawaroh Bagian Pendidikan Desa Sangatta Selatan.">
  <meta name="theme-color" content="#064E3B">
  <!-- PWA: bisa diinstal di HP & laptop (v1.6) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PPG Desa SS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Koneksi awal ke server agar permintaan pertama lebih cepat -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <!-- Font dimuat tanpa memblok tampilan pertama (Prinsip 9) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="assets/css/style.css?v=1.6.1">

  <!-- Terapkan tema sebelum halaman digambar (tanpa kedipan) -->
  <script>
    (function () {
      try {
        var dark = localStorage.getItem('mp_theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var bc = localStorage.getItem('mp_brand_css');   // warna utama pilihan admin (v1.4)
        if (bc) { var st = document.createElement('style'); st.id = 'brand-css'; st.textContent = bc; document.head.appendChild(st); }
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body>
  <div id="app">
    <div id="view" class="view">
      <div class="boot">
        <div class="boot-mark"></div>
        <div class="boot-text">Memuat aplikasi…</div>
      </div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="layer"></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p>
  </noscript>

  <script src="config.js?v=1.6.1"></script>
  <script src="assets/js/core.js?v=1.6.1" defer></script>
  <script src="assets/js/schema.js?v=1.6.1" defer></script>
  <script src="assets/js/pdf.js?v=1.6.1" defer></script>
  <script src="assets/js/form.js?v=1.6.1" defer></script>
  <script src="assets/js/dash.js?v=1.6.1" defer></script>
  <script src="assets/js/public.js?v=1.6.1" defer></script>
  <script src="assets/js/notulen.js?v=1.6.1" defer></script>
  <script src="assets/js/monitoring.js?v=1.6.1" defer></script>
  <!-- Modul admin (admin, hadir, musyawaroh, pengaturan) dimuat otomatis saat #/admin dibuka -->
  <script src="assets/js/app.js?v=1.6.1" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
